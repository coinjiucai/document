<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <link rel="icon" href="<%= BASE_URL %>favicon.png">
    <script>
        // 检测当前页面是否是通过刷新加载的
        function isPageReloaded() {
            if (window.performance) {
                const navEntries = performance.getEntriesByType("navigation");
                if (navEntries.length > 0) {
                    const navigationType = navEntries[0].type;
                    return navigationType === 'reload'; // 返回 true 表示是刷新
                }
            }
            return false;
        }

        const isRefresh = isPageReloaded();
        if (!isRefresh) {
            localStorage.clear();
            // 清除当前TOKEN
            document.cookie = `MBS-HAS-LOGIN=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;`;
        } 
    </script>
    <!-- 加载配置文件 -->
    <script src="<%= BASE_URL %>config.js?v=<%= new Date().getTime() %>"></script>
    <title></title>
</head>

<body>
    <div id="app"></div>
</body>

</html>
